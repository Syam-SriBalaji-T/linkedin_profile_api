services:
  migrate:
    build: ./api
    command: ['pnpm', 'migrate:prod']
    env_file: ./api/.env
    restart: 'no'

  api:
    build: ./api
    command: ['node', 'dist/main.js']
    env_file: ./api/.env
    environment:
      PORT: '3001'
    restart: unless-stopped
    networks:
      default: {}
      # Alias rather than the service name: another project may also call a
      # service `api`, and they would collide on the shared network.
      edge:
        aliases: ['unfurl-api']

  worker:
    build: ./api
    command: ['node', 'dist/worker.js']
    env_file: ./api/.env
    restart: unless-stopped
    # The image's HEALTHCHECK probes the HTTP server on :3001, which this
    # process does not run. Disable it so the container reports honestly.
    healthcheck:
      disable: true

  web:
    build: ./web
    env_file: ./web/.env
    environment:
      API_BASE_URL: http://api:3001
      PORT: '3000'
    restart: unless-stopped
    depends_on:
      - api
    networks:
      default: {}
      edge:
        aliases: ['unfurl-web']

  db:
    profiles: ['local-db']
    image: postgres:17.2-alpine
    environment:
      POSTGRES_USER: unfurl
      POSTGRES_PASSWORD: unfurl
      POSTGRES_DB: unfurl
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U unfurl -d unfurl']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:

# Owned by the edge project, so Compose here neither creates nor removes it.
networks:
  edge:
    external: true
