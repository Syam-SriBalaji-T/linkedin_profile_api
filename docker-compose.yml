services:
  migrate:
    build: ./api
    command: ['pnpm', 'migrate:prod']
    env_file: ./api/.env
    restart: 'no'

  api:
    build: ./api
    command: ['node', 'dist/main.js']
    env_file: ./api/.env
    environment:
      PORT: '3001'
    restart: unless-stopped

  worker:
    build: ./api
    command: ['node', 'dist/worker.js']
    env_file: ./api/.env
    restart: unless-stopped
    # The image's HEALTHCHECK probes the HTTP server on :3001, which this
    # process does not run. Disable it so the container reports honestly.
    healthcheck:
      disable: true

  web:
    build: ./web
    env_file: ./web/.env
    environment:
      API_BASE_URL: http://api:3001
      PORT: '3000'
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  db:
    profiles: ['local-db']
    image: postgres:17.2-alpine
    environment:
      POSTGRES_USER: unfurl
      POSTGRES_PASSWORD: unfurl
      POSTGRES_DB: unfurl
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U unfurl -d unfurl']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
  caddy_data:
  caddy_config:
